name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    name: C++ engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Base install only -- no pygame. If a core module ever grows a
      # rendering import, the suite fails here instead of on a headless box.
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest
      - name: Headless episode
        run: python -m interception.cli --headless --seed 0
      - name: Seed sweep
        run: python -m interception.cli --trials 25 --seed 0

  wasm:
    name: WebAssembly bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61
          actions-cache-folder: emsdk-cache
      - name: Configure
        run: emcmake cmake -S . -B build-wasm -DINTERCEPTION_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build-wasm -j"$(nproc)"
      - name: Check the bundle exists
        run: test -f web/public/interception.wasm && test -f web/public/interception.js
      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/public
          retention-days: 7
