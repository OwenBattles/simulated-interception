name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Base install only -- no pygame. If a core module ever grows a
      # rendering import, the suite fails here instead of on a headless box.
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Headless episode
        run: python -m interception.cli --headless --seed 0
      - name: Seed sweep
        run: python -m interception.cli --trials 25 --seed 0
