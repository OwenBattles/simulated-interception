[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interception"
version = "0.2.0"
description = "2D counter-UAS interception simulator: guidance, avoidance, and engagement metrics"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Owen Battles" }]
dependencies = []

[project.optional-dependencies]
# The simulation core has no third-party dependencies; pygame is only
# needed to open a window, so CI installs the base package alone.
viz = ["pygame>=2.5"]
dev = ["pytest>=7.4"]

[project.scripts]
interception = "interception.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
